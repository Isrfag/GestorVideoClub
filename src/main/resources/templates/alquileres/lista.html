<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<!-- ✅ Layout con fragmento de contenido pasado correctamente -->
<div th:replace="~{layout :: layout('Lista de Alquileres', ~{this :: content})}">

    <div th:fragment="content">

        <h1>🎞️ Listado de Alquileres</h1>

        <!-- ALERTAS -->
        <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <!-- FILTRO -->
        <div class="filter" style="margin-bottom: 15px;">
            <form th:action="@{/alquileres}" method="get" style="display:flex; gap:10px;">
                <input type="text" name="buscar"
                       placeholder="Buscar por cliente o película"
                       th:value="${param.buscar}"
                       style="padding:8px; width:250px; border-radius:4px; border:1px solid #ccc;">
                <button type="submit" style="padding:8px 12px; background:#157a15; color:white; border:none; border-radius:4px; cursor:pointer;">
                    🔎 Buscar
                </button>
            </form>
        </div>

        <!-- TABLA DE ALQUILERES -->
        <table style="width:100%; border-collapse:collapse; margin-top:10px;">
            <thead>
            <tr style="background:#f4f4f4; text-align:left;">
                <th style="padding:10px; border:1px solid #ddd;">ID</th>
                <th style="padding:10px; border:1px solid #ddd;">Cliente</th>
                <th style="padding:10px; border:1px solid #ddd;">Película</th>
                <th style="padding:10px; border:1px solid #ddd;">Fecha alquiler</th>
                <th style="padding:10px; border:1px solid #ddd;">Fecha devolución</th>
                <th style="padding:10px; border:1px solid #ddd;">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="alquiler : ${alquileres}" style="vertical-align:middle;">
                <td style="padding:10px; border:1px solid #ddd;" th:text="${alquiler.id}"></td>
                <td style="padding:10px; border:1px solid #ddd;" th:text="${alquiler.clienteNombre}"></td>
                <td style="padding:10px; border:1px solid #ddd;" th:text="${alquiler.peliculaTitulo}"></td>
                <td style="padding:10px; border:1px solid #ddd;" th:text="${alquiler.fechaInicio}"></td>
                <td style="padding:10px; border:1px solid #ddd;" th:text="${alquiler.fechaFin != null ? alquiler.fechaFin : '—'}"></td>

                <td style="padding:10px; border:1px solid #ddd; vertical-align:middle;">
                    <!-- BOTÓN DEVOLVER SOLO SI NO SE HA DEVUELTO -->
                    <form th:if="${alquiler.fechaFin == null}"
                        th:action="@{'/alquileres/devolver/' + ${alquiler.id}}"
                        method="post"
                        style="display:inline; margin-right:8px;">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                        <button style="padding:6px 12px; background:#157a15; color:white; border:none; border-radius:4px; cursor:pointer;">
                            ✅ Devolver
                        </button>
                    </form>

                    <!-- MARCAR COMO DEVUELTO -->
                    <span th:if="${alquiler.fechaFin != null}" style="font-weight:bold; color:#555;">
                        ✅ Devuelto
                    </span>
                </td>
            </tr>

            <tr th:if="${alquileres.empty}">
                <td colspan="6" style="padding:10px; border:1px solid #ddd; text-align:center;">
                    No hay alquileres registrados.
                </td>
            </tr>
            </tbody>
        </table>

        <br>
        <a th:href="@{/peliculas}" style="display:inline-block; margin-top:15px;">⬅️ Volver al catálogo</a>

    </div>

</div>

</body>
</html>
