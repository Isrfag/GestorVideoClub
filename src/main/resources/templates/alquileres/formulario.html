<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body th:replace="~{layout :: layout('Alquilar Película', ~{this :: content})}">

    <div th:fragment="content">
    <h1>🎞️ Alquilar Película</h1>

    <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form th:action="@{/alquileres}" method="post"
          style="background:white;padding:20px;border-radius:8px;
                 box-shadow:0 0 5px rgba(0,0,0,0.1);max-width:500px;display:flex;
                 flex-direction:column;gap:15px;">

        <!-- ✅ CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Id de película -->
        <input type="hidden" name="peliculaId" th:value="${pelicula.id}" />

        <label>Película:</label>
        <input type="text" th:value="${pelicula.titulo}" disabled
               style="width:100%;padding:10px 12px;font-size:16px;border-radius:5px;
                      border:1px solid #ccc;"/>

        <label>Cliente:</label>
        <select name="clienteId" required
                style="width:100%;padding:10px 12px;font-size:16px;border-radius:5px;
                       border:1px solid #ccc;">
            <option value="">-- Selecciona un cliente --</option>
            <option th:each="cliente : ${clientes}"
                    th:value="${cliente.id}"
                    th:text="${cliente.nombre} + ' ' + ${cliente.apellido}">
            </option>
        </select>

        <a th:href="@{/clientes/nuevo}"
           style="display:inline-block;text-align:center;padding:10px 15px;
                  background:#157a15;color:white;border-radius:5px;
                  text-decoration:none;font-size:16px;">
            ➕ Nuevo cliente
        </a>

        <button type="submit"
                style="padding:12px 20px;font-size:16px;margin-top:10px;
                       background:#157a15;color:white;border:none;border-radius:5px;
                       cursor:pointer;">
            🎞️ Alquilar
        </button>
    </form>

    <br>
    <a th:href="@{/peliculas}">⬅️ Volver al catálogo</a>
</div>

</body>
</html>
