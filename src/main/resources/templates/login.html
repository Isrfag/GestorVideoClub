<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Videoclub</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f2f2f2;
        }

        .login-container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid;
        }

        .error {
            background: #ffd5d5;
            border-color: #ff8a8a;
            color: #a10000;
        }

        .success {
            background: #d5ffd5;
            border-color: #8aff8a;
            color: #006600;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>🎬 Videoclub</h1>

    <!-- ✅ Mensaje si hubo error en login -->
    <div th:if="${param.error}" class="alert error">
        Usuario o contraseña incorrectos.
    </div>

    <!-- ✅ Mensaje tras logout -->
    <div th:if="${param.logout}" class="alert success">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post">

        <label>Usuario:</label>
        <input type="text" name="username" required />

        <label>Contraseña:</label>
        <input type="password" name="password" required />

        <button type="submit">Acceder</button>
    </form>

    <div class="footer">
        Acceso restringido a empleados del videoclub
    </div>
</div>

</body>
</html>
