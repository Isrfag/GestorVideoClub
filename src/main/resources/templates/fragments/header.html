<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="header">
    <header style="
        font-family: Arial;
        background: #333;
        color: white;
        padding: 12px 20px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;">
        
        <div>
            <span style="font-size: 20px;">🎬 Videoclub — Panel</span>
        </div>

        <div>
            <span th:text="'Rol: ' + ${#authentication.principal.authorities[0].authority}"
                  style="margin-right: 15px;"></span>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit"
                        style="
                            background: #d9534f;
                            color: white;
                            padding: 6px 12px;
                            border: none;
                            border-radius: 4px;
                            cursor: pointer;">
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </header>
</div>

</body>
</html>
