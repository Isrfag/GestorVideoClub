<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fafafa; margin: 20px; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); max-width: 500px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; }
        button { margin-top: 15px; padding: 10px 15px; border: none; border-radius: 5px; background-color: #157a15; color: white; cursor: pointer; }
    </style>
</head>
<body>
<h1>➕ Nuevo Cliente</h1>

<form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
    <!-- Hidden field para redirección opcional -->
    <input type="hidden" name="peliculaId" th:value="${peliculaId}" />

    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}" required />

    <label>Apellido:</label>
    <input type="text" th:field="*{apellido}" />

    <label>Email:</label>
    <input type="email" th:field="*{email}" />

    <label>Teléfono:</label>
    <input type="text" th:field="*{telefono}" />

    <button type="submit">💾 Guardar Cliente</button>
</form>

<a th:href="@{/alquileres}">⬅️ Volver al listado de alquileres</a>
</body>
</html>
