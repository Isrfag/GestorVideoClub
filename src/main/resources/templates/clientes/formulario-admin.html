<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${cliente.id != null} ? 'Editar Cliente' : 'Nuevo Cliente', ~{this :: content})}">

<div th:fragment="content">

    <h1 th:text="${cliente.id != null} ? '✏️ Editar Cliente' : '➕ Nuevo Cliente'"></h1>

    <form th:action="@{/clientes/admin/guardar}" th:object="${cliente}" method="post"
          style="background:white; padding:25px; border-radius:8px;
                 box-shadow:0 0 5px rgba(0,0,0,0.1); max-width:500px; display:flex; flex-direction:column; gap:15px;">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- ✅ ESTE ES EL QUE FALTABA -->
        <input type="hidden" th:field="*{id}" />

        <!-- Si viene desde alquiler -->
        <input type="hidden" name="peliculaId" th:value="${peliculaId}" />

        <div style="display:flex; flex-direction:column;">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required />
        </div>

        <div style="display:flex; flex-direction:column;">
            <label>Apellido:</label>
            <input type="text" th:field="*{apellido}" />
        </div>

        <div style="display:flex; flex-direction:column;">
            <label>Email:</label>
            <input type="email" th:field="*{email}" />
        </div>

        <div style="display:flex; flex-direction:column;">
            <label>Teléfono:</label>
            <input type="text" th:field="*{telefono}" />
        </div>

        <button type="submit"
                style="padding:10px 15px; background:#157a15; color:white; border:none; border-radius:5px;">
            💾 Guardar Cliente
        </button>
    </form>

    <a th:href="@{/clientes}" style="display:inline-block; margin-top:15px;">
        ⬅️ Volver al listado de clientes
    </a>

</div>
</html>
