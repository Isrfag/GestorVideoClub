<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout :: layout('Lista de Usuarios', ~{this :: content})}">

<div th:fragment="content">

    <h1>👥 Lista de Usuarios</h1>

    <div th:if="${exito}" class="alert success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div style="margin-bottom: 15px;" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/usuarios/nuevo}">➕ Nuevo Usuario</a>
    </div>

    <table style="
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #ddd;
    ">
        <thead>
        <tr>
            <th style="padding: 10px 15px; border: 1px solid #ddd; text-align: left;">ID</th>
            <th style="padding: 10px 15px; border: 1px solid #ddd; text-align: left;">Usuario</th>
            <th style="padding: 10px 15px; border: 1px solid #ddd; text-align: left;">Rol</th>
            <th sec:authorize="hasRole('ADMIN')" style="padding: 10px 15px; border: 1px solid #ddd; text-align: left;">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${usuarios}">
            <td style="padding: 8px 15px; border: 1px solid #ddd;" th:text="${u.id}"></td>
            <td style="padding: 8px 15px; border: 1px solid #ddd;" th:text="${u.username}"></td>
            <td style="padding: 8px 15px; border: 1px solid #ddd;" th:text="${u.rol}"></td>

            <td sec:authorize="hasRole('ADMIN')" style="padding: 8px 15px; border: 1px solid #ddd;">
                <a th:href="@{|/usuarios/${u.id}/editar|}" style="margin-right:10px;">✏️ Editar</a>

                <form th:action="@{|/usuarios/${u.id}/eliminar|}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">❌ Eliminar</button>
                </form>
            </td>
        </tr>

        <tr th:if="${usuarios.empty}">
            <td colspan="4" style="padding: 8px 15px; border: 1px solid #ddd;">No hay usuarios registrados.</td>
        </tr>
        </tbody>
    </table>

</div>
</html>
