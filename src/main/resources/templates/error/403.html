<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 40px;
            text-align: center;
        }

        .box {
            display: inline-block;
            background: white;
            padding: 30px 40px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            color: #b30000;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        a:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🚫 Acceso Denegado</h1>
    <p>No tienes permisos para acceder a esta sección.</p>

    <a th:href="@{/peliculas}">Volver al menú</a>
</div>

</body>
</html>
